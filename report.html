<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6eee8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lunette" />
    <title>完整能量報告 | Lunette</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <link rel="stylesheet" href="styles.css?v=36" />
  </head>
  <body>
    <div class="phone-frame">
      <div class="app-shell form-shell">
        <header class="flow-topbar" aria-label="Full energy report">
          <a class="back-button" href="result.html" aria-label="Back to result">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </a>
          <h1>完整能量報告</h1>
          <span>REPORT</span>
        </header>

        <main class="report-main">
          <section class="form-title report-title" aria-labelledby="report-title">
            <h2 id="report-title"><span>✦</span> 你的完整能量解析 <span>✦</span></h2>
            <p data-report-summary>正在讀取你的命定能量關鍵詞...</p>
          </section>

          <section class="report-selection-card" aria-label="Your selected information" data-report-selections></section>

          <article class="report-card" data-full-report></article>

          <a class="next-button report-back" href="result.html">返回分析結果</a>
        </main>
      </div>
    </div>
    <script src="app.js?v=36"></script>
  </body>
