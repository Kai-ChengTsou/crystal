<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6eee8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lunette" />
    <title>基本資訊 | Lunette</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <link rel="stylesheet" href="styles.css?v=36" />
  </head>
  <body>
    <div class="phone-frame">
      <div class="app-shell form-shell">
        <header class="flow-topbar" aria-label="Basic information">
          <a class="back-button" href="personal.html" aria-label="Back to photo upload">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </a>
          <h1>個人命定水晶</h1>
          <span>STEP 2 / 5</span>
        </header>

        <main class="form-main">
          <nav class="stepper form-stepper" aria-label="Analysis steps">
            <div class="step is-done">
              <span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
              </span>
              <p>1 認識氣質</p>
            </div>
            <div class="step is-active">
              <span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20 12v10H4V12" />
                  <path d="M2 7h20v5H2z" />
                  <path d="M12 22V7" />
                </svg>
              </span>
              <p>2 基本資訊</p>
            </div>
            <div class="step">
              <span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z" />
                </svg>
              </span>
              <p>3 最近的你</p>
            </div>
            <div class="step">
              <span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 3h12l4 6-10 12L2 9l4-6Z" />
                  <path d="M2 9h20" />
                </svg>
              </span>
              <p>4 風格偏好</p>
            </div>
            <div class="step">
              <span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m12 2 2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6Z" />
                </svg>
              </span>
              <p>5 分析結果</p>
            </div>
          </nav>

          <section class="form-title" aria-labelledby="basic-title">
            <h2 id="basic-title"><span>✦</span> 填寫你的基本資訊 <span>✦</span></h2>
            <p>這些資訊將幫助 AI 更精準分析你的能量與推薦水晶</p>
          </section>

          <form class="info-card">
            <section class="field-group">
              <h3>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 2v4" />
                  <path d="M16 2v4" />
                  <rect x="3" y="4" width="18" height="18" rx="2" />
                  <path d="M3 10h18" />
                </svg>
                你的出生日期
              </h3>
              <div class="date-grid">
                <label>
                  <select name="birth-year" aria-label="出生年份" data-year-start="1920" data-default-year="1995"></select>
                </label>
                <label>
                  <select name="birth-month" aria-label="出生月份">
                    <option>1 月</option>
                    <option>2 月</option>
                    <option>3 月</option>
                    <option>4 月</option>
                    <option>5 月</option>
                    <option selected>6 月</option>
                    <option>7 月</option>
                    <option>8 月</option>
                    <option>9 月</option>
                    <option>10 月</option>
                    <option>11 月</option>
                    <option>12 月</option>
                  </select>
                </label>
                <label>
                  <select name="birth-day" aria-label="出生日期">
                    <option>1 日</option>
                    <option>2 日</option>
                    <option>3 日</option>
                    <option>4 日</option>
                    <option>5 日</option>
                    <option>6 日</option>
                    <option>7 日</option>
                    <option>8 日</option>
                    <option>9 日</option>
                    <option>10 日</option>
                    <option>11 日</option>
                    <option>12 日</option>
                    <option>13 日</option>
                    <option>14 日</option>
                    <option>15 日</option>
                    <option>16 日</option>
                    <option>17 日</option>
                    <option selected>18 日</option>
                    <option>19 日</option>
                    <option>20 日</option>
                    <option>21 日</option>
                    <option>22 日</option>
                    <option>23 日</option>
                    <option>24 日</option>
                    <option>25 日</option>
                    <option>26 日</option>
                    <option>27 日</option>
                    <option>28 日</option>
                    <option>29 日</option>
                    <option>30 日</option>
                    <option>31 日</option>
                  </select>
                </label>
              </div>
            </section>

            <section class="field-group">
              <h3>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                你的性別
              </h3>
              <div class="choice-row" data-choice-mode="single">
                <button class="is-selected" type="button">女性</button>
                <button type="button">男性</button>
                <button type="button">不便透露</button>
              </div>
            </section>

            <section class="field-group">
              <h3>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 22s8-4 8-10a8 8 0 0 0-16 0c0 6 8 10 8 10Z" />
                </svg>
                你的生活狀態（可複選）
              </h3>
              <div class="pill-grid" data-choice-mode="multi">
                <button type="button">學生</button>
                <button class="is-selected" type="button">上班族</button>
                <button type="button">創業中</button>
                <button type="button">自由工作者</button>
                <button type="button">家庭主婦</button>
                <button type="button">其他</button>
              </div>
            </section>

            <section class="field-group">
              <h3>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z" />
                </svg>
                你目前最在意的面向（可複選，最多 3 項）
              </h3>
              <div class="focus-grid" data-choice-mode="multi" data-max-selected="3">
                <button class="is-selected" type="button">☺<strong>情緒療癒</strong></button>
                <button type="button">♧<strong>人際關係</strong></button>
                <button type="button">♡<strong>愛情感情</strong></button>
                <button class="is-selected" type="button">▣<strong>事業財運</strong></button>
                <button type="button">♢<strong>自我成長</strong></button>
                <button type="button">♡<strong>健康活力</strong></button>
                <button type="button">▤<strong>學業考試</strong></button>
                <button type="button">⌂<strong>家庭和諧</strong></button>
              </div>
            </section>

            <button class="next-button form-next" type="button" data-next="recent.html">
              下一步
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m12 2 1.7 5.1L19 9l-5.3 1.9L12 16l-1.7-5.1L5 9l5.3-1.9L12 2Z" />
              </svg>
            </button>
          </form>
        </main>
      </div>
    </div>
    <script src="app.js?v=36"></script>
  </body>
</html>
