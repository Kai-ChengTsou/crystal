[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/analyze"
  to = "/.netlify/functions/analyze"
  status = 200

[[redirects]]
  from = "/api/generate-bracelet"
  to = "/.netlify/functions/generate-bracelet"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
